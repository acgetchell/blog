name: Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          submodules: recursive

      - name: Run CI checks
        uses: ./.github/actions/run-just-ci

      - name: Deploy
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453  # v4.0.0 (tag is annotated; tag object 47f197a2200b...)
        with:
          personal_token: ${{ secrets.TOKEN }}
          external_repository: acgetchell/acgetchell.github.io
          publish_branch: main
          publish_dir: ./public
          user_name: acgetchell
          user_email: adam@adamgetchell.org
          cname: www.adamgetchell.org
